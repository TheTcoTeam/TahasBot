name: Bale Heavy Downloader Worker

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Target Video/Audio URL'
        required: true
      chat_id:
        description: 'Bale Chat ID'
        required: true
      message_id:
        description: 'Bale Progress Message ID'
        required: false
        default: '0'
      format:
        description: 'Format (mp4, mp3)'
        required: false
        default: 'mp4'
      quality:
        description: 'Video Quality (1080p, 720p, 480p, 360p, 240p)'
        required: false
        default: '720p'
      slice_mb:
        description: 'Slice size limit in MB'
        required: false
        default: '25'
      subtitles:
        description: 'Send subtitles (true/false)'
        required: false
        default: 'false'
      thumbnail:
        description: 'Send thumbnail (true/false)'
        required: false
        default: 'false'
      description:
        description: 'Send description (true/false)'
        required: false
        default: 'false'
      comments:
        description: 'Send top comments (true/false)'
        required: false
        default: 'false'

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Install Deno (JavaScript Runtime for yt-dlp)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install "yt-dlp[default,curl-cffi]" yt-dlp-get-pot requests mutagen urllib3

      - name: Setup YouTube POT Provider & Plugin
        run: |
          curl -sL https://github.com/jim60105/bgutil-ytdlp-pot-provider-rs/releases/latest/download/bgutil-pot-linux-x86_64 -o /usr/local/bin/bgutil-pot
          chmod +x /usr/local/bin/bgutil-pot
          /usr/local/bin/bgutil-pot server --host 127.0.0.1 --port 4416 &
          curl -sL https://github.com/jim60105/bgutil-ytdlp-pot-provider-rs/releases/latest/download/bgutil-ytdlp-pot-provider-rs.zip -o /tmp/plugin.zip
          mkdir -p ~/.yt-dlp/plugins
          unzip -q -o /tmp/plugin.zip -d ~/.yt-dlp/plugins/
          mkdir -p ./plugins
          unzip -q -o /tmp/plugin.zip -d ./plugins/
          sleep 2
          curl -s http://127.0.0.1:4416/ping || true

      - name: Execute Worker
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          YT_URL: ${{ github.event.inputs.url }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          MESSAGE_ID: ${{ github.event.inputs.message_id }}
          YT_FORMAT: ${{ github.event.inputs.format }}
          YT_QUALITY: ${{ github.event.inputs.quality }}
          SLICE_MB: ${{ github.event.inputs.slice_mb }}
          SEND_SUBTITLES: ${{ github.event.inputs.subtitles }}
          SEND_THUMBNAIL: ${{ github.event.inputs.thumbnail }}
          SEND_DESCRIPTION: ${{ github.event.inputs.description }}
          SEND_COMMENTS: ${{ github.event.inputs.comments }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          python worker.py
