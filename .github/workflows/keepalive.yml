name: TahasBot 24/7 Keep-Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free service from idling/sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping TahasBot Health Endpoint
        run: |
          echo "Pinging TahasBot on Render to keep alive..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://tahasbot.onrender.com/health)
          echo "Response HTTP Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Service may be waking up, retrying in 5 seconds..."
            sleep 5
            curl -s https://tahasbot.onrender.com/health
          fi
