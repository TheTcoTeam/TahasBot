name: Keep Render awake

# Render's free web services sleep after 15 idle minutes. The bot also pings
# itself; this is a second, independent wake-up in case the instance did sleep.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the bot
        run: |
          for i in 1 2 3; do
            curl -fsS -m 90 "${{ vars.RENDER_URL || 'https://tahasbot.onrender.com' }}/" && exit 0
            sleep 20
          done
          exit 0
