name: Diagnostics

# Manual check of which platforms the runner's IP can reach.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      pot-provider:
        image: brainicism/bgutil-ytdlp-pot-provider:latest
        ports:
          - 4416:4416
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Static ffmpeg build: apt mirrors on the runners sometimes hang for 20+ min.
      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Install fonts (Persian/Arabic + Latin)
        timeout-minutes: 4
        run: |
          mkdir -p ~/.fonts
          base=https://github.com/notofonts/notofonts.github.io/raw/main/fonts
          curl -fsSL -o ~/.fonts/NotoNaskhArabic-Regular.ttf $base/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Regular.ttf || true
          curl -fsSL -o ~/.fonts/NotoSans-Regular.ttf $base/NotoSans/hinted/ttf/NotoSans-Regular.ttf || true
          fc-cache -f ~/.fonts || true
      - run: pip install -r requirements.txt
      - name: Cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
        run: |
          printf '%s\n' "$YOUTUBE_COOKIES" > cookies.txt
          printf '%s\n' "$IG_COOKIES" > ig_cookies.txt
      - run: python tests/diag_remote.py
